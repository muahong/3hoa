# Kiểm thử logic (node --test) cho mỗi lần đẩy và mỗi pull request. Không cần npm install.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm thử logic
        run: node tests/run.js
